[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[features]
mock = ["ocas-auth/mock"]

[dependencies]
async-trait = "0.1.89"
axum = "0.8.8"
dotenvy = "0.15.7"
meilisearch-sdk = { version = "0.32.0", default-features = false, features = ["reqwest", "tls", "jwt_rust_crypto"] }
ocas-auth = { git = "https://github.com/nuxshed/ocas", features = ["mock"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "macros", "chrono", "uuid"] }
tokio = { version = "1.49.0", features = ["full"] }
tower-http = { version = "0.6.8", features = ["compression-full", "cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "2.0"
sha2 = "0.10"
regex = "1"
uuid = { version = "1", features = ["v4", "serde", "v5"] }
ignore = "0.4.25"
