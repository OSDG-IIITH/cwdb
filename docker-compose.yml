services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - cwdb-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - PUBLISH_PATH=/app/data
    volumes:
      - publish_data:/app/data
    networks:
      - cwdb-network
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BASE_PATH: ${BASE_PATH:-}
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - publish_data:/data:ro
    networks:
      - cwdb-network
    depends_on:
      - backend

volumes:
  publish_data:

networks:
  cwdb-network:
